# Runs automatically on every change. A green ✓ next to your commit means
# emotions.js is fine; a red ✗ means something needs fixing (click it to see what).
name: Check emotions

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run-checks.js
